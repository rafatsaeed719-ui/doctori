name: Fetch promo fonts

# Downloads the open-licence (OFL) Arabic fonts used by the promo video into promo/fonts/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-fonts.yml"

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p promo/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o "promo/fonts/Cairo.ttf" "$base/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          curl -fsSL -o "promo/fonts/Cairo-OFL.txt" "$base/cairo/OFL.txt"
          for w in Regular Medium Bold ExtraBold; do
            curl -fsSL -o "promo/fonts/Tajawal-$w.ttf" "$base/tajawal/Tajawal-$w.ttf"
          done
          curl -fsSL -o "promo/fonts/Tajawal-OFL.txt" "$base/tajawal/OFL.txt"
          ls -la promo/fonts
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add promo/fonts
          git commit -m "Promo fonts (OFL)" || echo "nothing to commit"
          git push
