name: Build Doctori APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.doctori --project-name doctori .
          rm -rf test
          python3 tool/patch_android.py

      - name: Check server settings
        run: |
          test -f env/doctori.json || { echo "::error::app/env/doctori.json is missing"; exit 1; }

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && exit 0
          cat analyze.txt
          grep -E "^\s*error" analyze.txt | head -40 | while read -r line; do echo "::error::$line"; done
          exit 1

      - name: Build APK
        run: |
          mkdir -p out
          flutter build apk --release --dart-define-from-file=env/doctori.json
          cp build/app/outputs/flutter-apk/app-release.apk out/app-release.apk
          # Smaller build for modern phones (64-bit ARM, almost every Android phone since ~2017)
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=env/doctori.json
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/doctori-arm64.apk
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctori-apk
          path: app/out/*.apk

      - name: Publish release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: دكتوري — نسخة ${{ github.run_number }}
          body: نسخة تجريبية للمرحلة الأولى. نزّل doctori-arm64.apk (أصغر، لمعظم الموبايلات) أو app-release.apk (يعمل على كل الأجهزة).
          files: |
            app/out/doctori-arm64.apk
            app/out/app-release.apk
